services:
  postgres-test:
    image: postgres:17
    container_name: pulselink-postgres-test
    restart: "no"
    environment:
      POSTGRES_DB: pulselink_test
      POSTGRES_USER: pulselink_test_app
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:?Set POSTGRES_TEST_PASSWORD in .env}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pulselink_test_postgres_data:/var/lib/postgresql/data
    networks:
      - pulselink-test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulselink_test_app -d pulselink_test"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  pulselink-test:
    name: pulselink-test-network

volumes:
  pulselink_test_postgres_data:
    name: pulselink_test_postgres_data
