services:
  postgres:
    image: postgres:17
    container_name: pulselink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pulselink
      POSTGRES_USER: pulselink_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pulselink_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulselink_app -d pulselink"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pulselink_postgres_data:
